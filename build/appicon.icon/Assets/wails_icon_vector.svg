<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Database Cylinder Gradients -->
    <linearGradient id="dbTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="dbBodyGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="dbBodyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="dbBodyGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="40%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Node Radial Gradients -->
    <radialGradient id="nodeCyan" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>

    <radialGradient id="nodePurple" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="30%" stop-color="#c084fc" />
      <stop offset="85%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </radialGradient>

    <radialGradient id="nodeEmerald" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="30%" stop-color="#34d399" />
      <stop offset="85%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>

    <radialGradient id="nodeAmber" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </radialGradient>

    <!-- Filters for Depth and Glow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#021526" flood-opacity="0.6" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.5" />
    </filter>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Group with Drop Shadow for the entire freeform icon -->
  <g filter="url(#dropShadow)">
    <!-- High-Dimensional Vector Lattice (Constellation Lines) -->
    <g stroke="#0284c7" stroke-width="6" stroke-opacity="0.5" stroke-dasharray="12 8" stroke-linecap="round">
      <!-- Upper left web -->
      <line x1="512" y1="320" x2="310" y2="170" />
      <line x1="310" y1="170" x2="150" y2="290" />
      <line x1="150" y1="290" x2="220" y2="470" />
      <line x1="310" y1="170" x2="220" y2="470" />

      <!-- Upper right web -->
      <line x1="512" y1="320" x2="714" y2="170" />
      <line x1="714" y1="170" x2="874" y2="290" />
      <line x1="874" y1="290" x2="804" y2="470" />
      <line x1="714" y1="170" x2="804" y2="470" />

      <!-- Convergence to Database Base -->
      <line x1="220" y1="470" x2="340" y2="590" />
      <line x1="804" y1="470" x2="684" y2="590" />
      <line x1="512" y1="320" x2="512" y2="440" stroke="#38bdf8" stroke-width="8" stroke-dasharray="none" stroke-opacity="0.9" />
    </g>

    <!-- Solid Accent Connection Rays -->
    <g stroke="#7dd3fc" stroke-width="4" stroke-opacity="0.8">
      <line x1="512" y1="320" x2="310" y2="170" />
      <line x1="512" y1="320" x2="714" y2="170" />
    </g>

    <!-- 3D Vector Database Cylinder Stack -->
    <!-- Tier 3 (Bottom Platter) -->
    <g>
      <path d="M 232 680 L 232 770 C 232 850 358 910 512 910 C 666 910 792 850 792 770 L 792 680 Z" fill="url(#dbBodyGrad3)" />
      <ellipse cx="512" cy="680" rx="280" ry="88" fill="#0369a1" stroke="#38bdf8" stroke-width="4" />
      <!-- Subtle edge highlight -->
      <path d="M 232 770 C 358 860 666 860 792 770" fill="none" stroke="#0284c7" stroke-width="4" opacity="0.6" />
    </g>

    <!-- Tier 2 (Middle Platter) -->
    <g>
      <path d="M 232 540 L 232 620 C 232 700 358 760 512 760 C 666 760 792 700 792 620 L 792 540 Z" fill="url(#dbBodyGrad2)" />
      <ellipse cx="512" cy="540" rx="280" ry="88" fill="#0284c7" stroke="#38bdf8" stroke-width="4" />
    </g>

    <!-- Tier 1 (Top Platter & Vector Coordinate Space) -->
    <g>
      <path d="M 232 400 L 232 480 C 232 560 358 620 512 620 C 666 620 792 560 792 480 L 792 400 Z" fill="url(#dbBodyGrad1)" />
      <ellipse cx="512" cy="400" rx="280" ry="88" fill="url(#dbTopGrad)" stroke="#bae6fd" stroke-width="5" />

      <!-- Polar Coordinate & Embedding Vector Rings -->
      <ellipse cx="512" cy="400" rx="200" ry="62" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-dasharray="10 8" opacity="0.9" />
      <ellipse cx="512" cy="400" rx="108" ry="34" fill="#0284c7" stroke="#ffffff" stroke-width="4" />
    </g>

    <!-- Central Vector Pointer (ANN Similarity Beam) -->
    <g>
      <path d="M 512 390 L 476 325 L 502 330 L 512 215 L 522 330 L 548 325 Z" fill="url(#beamGrad)" />
      <polygon points="512,205 528,245 512,238 496,245" fill="#ffffff" />
    </g>

    <!-- Multi-Dimensional Vector Embedding Nodes (High-D Cluster) -->
    <!-- Center Focal Node -->
    <circle cx="512" cy="320" r="38" fill="url(#nodeCyan)" filter="url(#nodeGlow)" stroke="#ffffff" stroke-width="7" />
    <circle cx="512" cy="320" r="14" fill="#ffffff" />

    <!-- Outer Nodes -->
    <circle cx="714" cy="170" r="32" fill="url(#nodePurple)" filter="url(#nodeGlow)" stroke="#ffffff" stroke-width="6" />
    <circle cx="310" cy="170" r="30" fill="url(#nodeEmerald)" filter="url(#nodeGlow)" stroke="#ffffff" stroke-width="6" />
    <circle cx="874" cy="290" r="26" fill="url(#nodeAmber)" filter="url(#nodeGlow)" stroke="#ffffff" stroke-width="5" />
    <circle cx="150" cy="290" r="26" fill="url(#nodeCyan)" filter="url(#nodeGlow)" stroke="#ffffff" stroke-width="5" />
    <circle cx="804" cy="470" r="24" fill="url(#nodeEmerald)" filter="url(#nodeGlow)" stroke="#ffffff" stroke-width="5" />
    <circle cx="220" cy="470" r="24" fill="url(#nodePurple)" filter="url(#nodeGlow)" stroke="#ffffff" stroke-width="5" />

    <!-- Status Lights on Database Body -->
    <circle cx="275" cy="500" r="6" fill="#34d399" />
    <circle cx="275" cy="640" r="6" fill="#38bdf8" />
    <circle cx="275" cy="780" r="6" fill="#a855f7" />
  </g>
</svg>
