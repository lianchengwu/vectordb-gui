name: Build and Package

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux (x86_64)
            os: ubuntu-latest
            artifact_name: tcvectordb-gui-linux-amd64
            archive_name: tcvectordb-gui-linux-amd64.tar.gz
          - name: Windows (x86_64)
            os: windows-latest
            artifact_name: tcvectordb-gui-windows-amd64
            archive_name: tcvectordb-gui-windows-amd64.zip
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifact_name: tcvectordb-gui-macos-arm64
            archive_name: tcvectordb-gui-macos-arm64.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            gcc \
            pkg-config

      - name: Install Wails v3 CLI
        env:
          CGO_ENABLED: 0
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.22
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          cd ..

      - name: Run Backend Unit Tests
        run: |
          go test ./backend/... -v
      - name: Build Application (Linux)
        if: runner.os == 'Linux'
        run: |
          wails3 task linux:build
          mkdir -p pkg
          cp bin/tcvectordb-gui pkg/
          cp build/appicon.png pkg/tcvectordb-gui.png
          cp build/linux/tcvectordb-gui.desktop pkg/
          cp build/linux/install.sh pkg/
          chmod +x pkg/install.sh pkg/tcvectordb-gui
          tar -czvf "bin/${{ matrix.platform.archive_name }}" -C pkg \
            tcvectordb-gui tcvectordb-gui.png tcvectordb-gui.desktop install.sh

      - name: Build Application (Windows)
        if: runner.os == 'Windows'
        run: |
          wails3 task windows:build
          Compress-Archive -Path "bin/tcvectordb-gui.exe" -DestinationPath "bin/${{ matrix.platform.archive_name }}"

      - name: Build Application (macOS)
        if: runner.os == 'macOS'
        run: |
          wails3 task darwin:package
          cd bin
          zip -r "${{ matrix.platform.archive_name }}" tcvectordb-gui.app
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: bin/${{ matrix.platform.archive_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..
          ls -lh dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
